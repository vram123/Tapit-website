<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>TapIt — the fastest way to connect</title>
    <meta
      name="description"
      content="One tap shares your phone, socials, LinkedIn, resume, and GitHub. Perfect for students, recruiters, and friends — right on the spot."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://YOUR-DOMAIN-HERE/" />

    <!-- Favicons / PWA -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph (link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TapIt" />
    <meta property="og:title" content="TapIt — the fastest way to connect" />
    <meta
      property="og:description"
      content="Share your phone, socials, LinkedIn, resume, and GitHub with one tap."
    />
    <meta property="og:url" content="https://YOUR-DOMAIN-HERE/" />
    <meta property="og:image" content="%PUBLIC_URL%/social/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TapIt — the fastest way to connect" />
    <meta
      name="twitter:description"
      content="Share your phone, socials, LinkedIn, resume, and GitHub with one tap."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/social/og-image.jpg" />
    <!-- Optional: <meta name="twitter:site" content="@yourhandle" /> -->

    <!-- Optional: preload a brand font -->
    <!-- <link rel="preload" href="%PUBLIC_URL%/fonts/YourFont.woff2" as="font" type="font/woff2" crossorigin> -->

    <!-- Structured data (helps SEO & price consistency for crawlers) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "TapIt NFC Card",
      "brand": { "@type": "Brand", "name": "TapIt" },
      "description": "Share phone, socials, LinkedIn, resume, and GitHub with one tap.",
      "sku": "tapit-card",
      "offers": {
        "@type": "Offer",
        "priceCurrency": "USD",
        "price": "10.00",
        "availability": "https://schema.org/InStock",
        "url": "https://YOUR-DOMAIN-HERE/payment"
      }
    }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
